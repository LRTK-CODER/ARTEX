# ARTEX Tencent TSec Benchmark 평가 이미지. 로컬에서 한 번에 build + run 한다.
# 운영용 docker-compose.yml(다중 서비스: artex+postgres)과 서로 영향을 주지 않는다.
# 사용법:
#   cp bench/.env.example bench/.env   # LLM_API_KEY / BENCHMARK_TOKEN 등을 채운다
#   docker compose -f docker-compose.bench.yml up --build      # 빌드하고 포그라운드로 실행(로그 보기)
#   docker compose -f docker-compose.bench.yml up --build -d   # 백그라운드
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # 중지(-v를 붙이면 데이터 볼륨도 함께 지운다)
# 브라우저: http://localhost:8787(ADMIN_PASSWORD로 로그인)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # 물리 머신과 네트워크를 공유한다: 컨테이너가 호스트 네트워크 스택을 그대로 써서 호스트·VPN 너머의 테스트 대상 머신 네트워크에 바로 연결할 수 있다.
    # host 모드에서는 ports 매핑 없이 컨테이너가 호스트 포트에 직접 바인딩한다: 8787(UI/API), 8788(프록시),
    # 내부 PostgreSQL 5432. 호스트에서 이 세 포트가 비어 있어야 한다(로컬 테스트 전에 이 포트를 쓰는 서비스를 먼저 멈춘다).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
