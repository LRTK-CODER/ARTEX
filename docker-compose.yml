services:
  postgres:
    # 태그와 공식 이미지의 멀티 아키텍처 인덱스 digest를 함께 적어 같은 이미지를 받는다. 갱신은 Dependabot이 한다.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: ghcr.io/lrtk-coder/artex:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 데이터 디렉터리(SQLite 등)를 프로젝트 루트의 data/에 연결한다.
      # 호스트에서 바로 보고 백업할 수 있고, 컨테이너를 다시 만들어도 남는다.
      - ./data:/app/data
      # 서버 키(jwt.key, oauth.key, 이미지의 ARTEX_KEY_DIR=/app/keys)를 프로젝트 루트의 keys/ 에 둔다.
      # 컨테이너를 다시 만들어도 웹 세션과 ChatGPT 구독 로그인이 유지된다. 백업 대상이다.
      - ./keys:/app/keys
      # 프로젝트 루트의 skills를 컨테이너에 마운트한다(이미지에 내장된 /app/skills를 덮어쓴다).
      # 컨테이너가 호스트의 사본을 읽으므로 스킬을 고쳐도 이미지를 다시 빌드하지 않아도 된다.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
